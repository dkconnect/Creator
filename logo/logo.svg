<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Platinum/Champagne Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <!-- Subtle Accent Gradient for Node -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="crisp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Rounded Square Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" filter="url(#crisp-shadow)" />

  <!-- Subtle Architectural Grid Matrix (Spatial Hashing Motif) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="2">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- Precision Coordinate Crosshairs / Vector Anchors -->
  <g stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round">
    <!-- Top-left coordinate tick -->
    <path d="M 128 144 L 128 128 L 144 128" fill="none" />
    <!-- Bottom-right coordinate tick -->
    <path d="M 384 368 L 384 384 L 368 384" fill="none" />
  </g>

  <!-- Vector Lattice & Pattern Node Guides (Inner Logic) -->
  <g stroke="url(#cyan-grad)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="4 4">
    <line x1="176" y1="256" x2="336" y2="256" />
    <line x1="256" y1="176" x2="256" y2="336" />
  </g>

  <!-- The Core Monogram 'C' (Vector Form) -->
  <path d="
    M 360 160
    L 296 160
    C 210 160, 160 210, 160 256
    C 160 302, 210 352, 296 352
    L 360 352
    L 360 304
    L 300 304
    C 246 304, 216 284, 216 256
    C 216 228, 246 208, 300 208
    L 360 208
    Z" 
    fill="url(#gold-grad)" 
    stroke="#FFF3C4" 
    stroke-width="2" 
    stroke-opacity="0.4"
  />

  <!-- Algorithmic Intersection Node (Accent Point) -->
  <circle cx="256" cy="256" r="8" fill="url(#cyan-grad)" stroke="#07080B" stroke-width="3" />
  
  <!-- Outer Frame Border (Fine Editorial Inset Line) -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.25" />
</svg>
